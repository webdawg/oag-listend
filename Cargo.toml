[workspace]
resolver = "2"
members = ["crates/oag-listend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
blake3 = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# The systemd unit builds with `cargo build --release`, so the shipped binary
# should be small and fast rather than default-sized.
[profile.release]
lto = true
codegen-units = 1
strip = true
