[package]
name = "oag-listend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reticulum = { version = "=0.1.0", optional = true }
blake3.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
default = []
# The Reticulum carrier. It pulls in the `reticulum` crate (gRPC, protobuf codegen, a crypto
# stack), which is far heavier than this daemon's other three dependencies, so it is opt-in: the
# default build and the default gate do not pay for it, and `check-reticulum` runs the suite with
# it. Without this feature the carrier does not exist and no extra dependency is compiled.
reticulum = ["dep:reticulum"]
